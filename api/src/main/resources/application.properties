spring.application.name=gamificacao.grupo-7
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/${POSTGRES_DB:devops}}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Desafio 1 (ADR-001) — arquitetura final: monolito modular + virtual threads.
# A decisao pertence a aplicacao (nao a injecao do harness de carga); a
# campanha final apenas VERIFICA a ativacao via jcmd (threads virtuais no dump).
spring.threads.virtual.enabled=true

# Evidencia de carga: o pool default (10) saturava sob a admissao ampliada
# pelas VT (fila de ate ~200 no Hikari); 50 acompanha o teto de concorrencia
# da configuracao final.
spring.datasource.hikari.maximum-pool-size=50

management.endpoints.web.exposure.include=health,metrics
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/docs