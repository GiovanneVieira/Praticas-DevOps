x-k6-cenario: &k6-cenario
  profiles: [loadtest]
  restart: "no"
  image: grafana/k6:latest
  user: "${K6_UID:-1000}:${K6_GID:-1000}"
  environment:
    BASE_URL: http://api:8080
    # Fase corrente para o rotulo do cenario no dashboard web ("fase · cenario")
    FASE: ${FASE:-debug}
    # Web dashboard do k6: UI ao vivo em http://localhost:5665 durante o
    # cenario + export de HTML auto-contido (/out/dashboard.html) como
    # evidencia interativa versionada. Porta unica: os cenarios sao
    # sequenciais (cadeia depends_on), logo nunca disputam 5665.
    K6_WEB_DASHBOARD: "true"
    K6_WEB_DASHBOARD_HOST: 0.0.0.0
    K6_WEB_DASHBOARD_PORT: "5665"
    K6_WEB_DASHBOARD_EXPORT: /out/dashboard.html
  ports:
    - "5665:5665"
  volumes:
    - ./tools/loadtest:/scripts:ro
    - ./docs/arquitetura/evidencias/desafio1/${FASE:-debug}:/fase

services:
  api:
    build:
      # Contexto parametrizável: campanhas de baseline usam um worktree do
      # commit pré-modularização via LOADTEST_API_CONTEXT (tools/loadtest).
      context: ${LOADTEST_API_CONTEXT:-api}
      dockerfile: dockerfile
      target: dev
    container_name: devops_api
    env_file:
      - .env.api
    environment:
      # Overrides de carga (Desafio 1): campanhas k6 sobem com
      # SPRING_JPA_SHOW_SQL=false; a fase virtual-threads sobe com
      # SPRING_THREADS_VIRTUAL_ENABLED=true; a fase tuning eleva o pool
      # Hikari. Defaults preservam o dev diario.
      - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL:-true}
      - SPRING_THREADS_VIRTUAL_ENABLED=${SPRING_THREADS_VIRTUAL_ENABLED:-false}
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-10}
    healthcheck:
      # Imagem dev (temurin alpine) tem busybox wget; start_period generoso
      # porque o dev target compila dentro do container a cada boot.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 240s
    ports:
      - "8080:8080"
      - "5005:5005"
    develop:
      watch:
        - action: rebuild
          path: ./api/pom.xml
        - action: sync+restart
          path: ./api/src
          target: /app/src
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: client
      dockerfile: dockerfile
      target: dev
    container_name: devops_client
    environment:
      - API_PROXY_TARGET=http://api:8080
    develop:
      watch:
        - path: ./client/src
          action: sync
          target: /app/src
        - path: ./client/package.json
          action: rebuild
        - path: ./client/package-lock.json
          action: rebuild
    env_file:
      - .env.client
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: devops_postgres
    restart: always
    environment:
      POSTGRES_DB: devops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Harness de carga do Desafio 1 (RF01/RF02) — perfil dedicado:
  #   docker compose -p pratica5-loadtest --profile loadtest up ...
  # Isolado por nome de projeto (-p): volumes/rede próprios; o `down -v` das
  # campanhas nunca toca o banco do dev. Orquestrado por tools/loadtest/run-loadtest.sh:
  # seed 1x via `run`, cenarios sequenciais via `run --rm --no-deps` (minimo
  # churn de daemon — o Docker 29.x tem bug de ciclo de vida sob `up` repetido).
  # ==========================================================================
  seed:
    profiles: [loadtest]
    restart: "no"
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: admin
      PGDATABASE: devops
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "[seed] aguardando schema do Hibernate..."
        until psql -tAc "select 1 from information_schema.tables where table_name='alunos'" | grep -q 1; do
          sleep 2
        done
        psql -v ON_ERROR_STOP=1 -f /seed.sql
    volumes:
      - ./tools/loadtest/seed.sql:/seed.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  k6-alunos-page:
    <<: *k6-cenario
    container_name: loadtest_k6_alunos_page
    volumes:
      - ./tools/loadtest:/scripts:ro
      - ./docs/arquitetura/evidencias/desafio1/${FASE:-debug}/alunos-page:/out
      - ./docs/arquitetura/evidencias/desafio1/${FASE:-debug}:/fase
    entrypoint: ["sh", "-c"]
    command:
      - >-
        echo "== cenario: alunos-page inicio $$(date -Iseconds) ==" >> /fase/metricas-actuator.txt; k6 run -o json=/out/resultado.json --summary-export=/out/resumo.json /scripts/alunos-page.ts; ec=$$?; echo "== cenario: alunos-page fim $$(date -Iseconds) ==" >> /fase/metricas-actuator.txt; if [ $$ec -ne 0 ] && [ $$ec -ne 99 ]; then exit $$ec; fi

  k6-login:
    <<: *k6-cenario
    container_name: loadtest_k6_login
    volumes:
      - ./tools/loadtest:/scripts:ro
      - ./docs/arquitetura/evidencias/desafio1/${FASE:-debug}/login:/out
      - ./docs/arquitetura/evidencias/desafio1/${FASE:-debug}:/fase
    entrypoint: ["sh", "-c"]
    command:
      - >-
        echo "== cenario: login inicio $$(date -Iseconds) ==" >> /fase/metricas-actuator.txt; k6 run -o json=/out/resultado.json --summary-export=/out/resumo.json /scripts/login.ts; ec=$$?; echo "== cenario: login fim $$(date -Iseconds) ==" >> /fase/metricas-actuator.txt; if [ $$ec -ne 0 ] && [ $$ec -ne 99 ]; then exit $$ec; fi

  k6-dashboard:
    <<: *k6-cenario
    container_name: loadtest_k6_dashboard
    volumes:
      - ./tools/loadtest:/scripts:ro
      - ./docs/arquitetura/evidencias/desafio1/${FASE:-debug}/dashboard:/out
      - ./docs/arquitetura/evidencias/desafio1/${FASE:-debug}:/fase
    entrypoint: ["sh", "-c"]
    command:
      - >-
        echo "== cenario: dashboard inicio $$(date -Iseconds) ==" >> /fase/metricas-actuator.txt; k6 run -o json=/out/resultado.json --summary-export=/out/resumo.json /scripts/dashboard.ts; ec=$$?; echo "== cenario: dashboard fim $$(date -Iseconds) ==" >> /fase/metricas-actuator.txt; if [ $$ec -ne 0 ] && [ $$ec -ne 99 ]; then exit $$ec; fi

  k6-ranking:
    <<: *k6-cenario
    container_name: loadtest_k6_ranking
    volumes:
      - ./tools/loadtest:/scripts:ro
      - ./docs/arquitetura/evidencias/desafio1/${FASE:-debug}/ranking:/out
      - ./docs/arquitetura/evidencias/desafio1/${FASE:-debug}:/fase
    entrypoint: ["sh", "-c"]
    command:
      - >-
        echo "== cenario: ranking inicio $$(date -Iseconds) ==" >> /fase/metricas-actuator.txt; k6 run -o json=/out/resultado.json --summary-export=/out/resumo.json /scripts/ranking.ts; ec=$$?; echo "== cenario: ranking fim $$(date -Iseconds) ==" >> /fase/metricas-actuator.txt; if [ $$ec -ne 0 ] && [ $$ec -ne 99 ]; then exit $$ec; fi

  k6-write-flow:
    <<: *k6-cenario
    container_name: loadtest_k6_write_flow
    volumes:
      - ./tools/loadtest:/scripts:ro
      - ./docs/arquitetura/evidencias/desafio1/${FASE:-debug}/write-flow:/out
      - ./docs/arquitetura/evidencias/desafio1/${FASE:-debug}:/fase
    entrypoint: ["sh", "-c"]
    command:
      - >-
        echo "== cenario: write-flow inicio $$(date -Iseconds) ==" >> /fase/metricas-actuator.txt; k6 run -o json=/out/resultado.json --summary-export=/out/resumo.json /scripts/write-flow.ts; ec=$$?; echo "== cenario: write-flow fim $$(date -Iseconds) ==" >> /fase/metricas-actuator.txt; if [ $$ec -ne 0 ] && [ $$ec -ne 99 ]; then exit $$ec; fi

  metrics:
    profiles: [loadtest]
    restart: "no"
    image: curlimages/curl:latest
    environment:
      BASE_URL: http://api:8080
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          ts=$$(date -Iseconds)
          for m in hikaricp.connections.active hikaricp.connections.pending hikaricp.connections.max tomcat.threads.busy tomcat.threads.current; do
            echo "$$ts $$m $$(curl -sf $$BASE_URL/actuator/metrics/$$m)" >> /out/metricas-actuator.txt
          done
          sleep 5
        done
    volumes:
      - ./docs/arquitetura/evidencias/desafio1/${FASE:-debug}:/out
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
