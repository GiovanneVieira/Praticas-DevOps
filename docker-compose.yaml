services:
  api:
    build:
      context: api
      dockerfile: dockerfile
      target: dev
    container_name: devops_api
    env_file:
      - .env.api
    environment:
      # Overrides de carga (Fase 2/4/5 do Desafio 1): rodadas k6 sobem com
      # SPRING_JPA_SHOW_SQL=false; apendice de virtual threads sobe com
      # SPRING_THREADS_VIRTUAL_ENABLED=true. Defaults preservam o dev diario.
      - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL:-true}
      - SPRING_THREADS_VIRTUAL_ENABLED=${SPRING_THREADS_VIRTUAL_ENABLED:-false}
    ports:
      - "8080:8080"
      - "5005:5005"
    develop:
      watch:
        - action: rebuild
          path: ./api/pom.xml
        - action: sync+restart
          path: ./api/src
          target: /app/src
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: client
      dockerfile: dockerfile
      target: dev
    container_name: devops_client
    environment:
      - API_PROXY_TARGET=http://api:8080
    develop:
      watch:
        - path: ./client/src
          action: sync
          target: /app/src
        - path: ./client/package.json
          action: rebuild
        - path: ./client/package-lock.json
          action: rebuild
    env_file:
      - .env.client
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: devops_postgres
    restart: always
    environment:
      POSTGRES_DB: devops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

